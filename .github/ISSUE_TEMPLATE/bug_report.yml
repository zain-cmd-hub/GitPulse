name: Bug Report
description: Create a report to help us improve GitPulse
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please ensure you are not reporting a security vulnerability here. For security issues, refer to our [Security Policy](https://github.com/zain-cmd-hub/GitPulse/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the problem is.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome / Browser Version
      description: E.g., Chrome 124.0, Brave 1.65, etc.
      placeholder: Google Chrome 124.0.6367.60
    validations:
      required: true

  - type: input
    id: challenge-url
    attributes:
      label: Target Challenge URL
      description: The URL of the challenge where the bug occurred.
      placeholder: https://30accd.xyz/dashboard/dsa-day-06-contains-duplicate-ii
    validations:
      required: true

  - type: textarea
    id: diagnostic-report
    attributes:
      label: Sanitized Diagnostic Report
      description: Open the GitPulse popup on the problem page, click "Run diagnostics", then "Copy report", and paste the JSON here.
      placeholder: |
        {
          "editorDetected": true,
          "editorType": "monaco",
          "language": "javascript",
          ...
        }
    validations:
      required: false

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps To Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open challenge '...'
        2. Click 'Submit'
        3. See error '...'
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

